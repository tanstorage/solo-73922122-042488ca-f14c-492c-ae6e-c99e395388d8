services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tryout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tryout"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tryout
      MAX_WORKERS: "4"
      STATEMENT_TIMEOUT_MS: "30000"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
